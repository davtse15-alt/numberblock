    function buildFaceSVG(num, isSleeping) {
      const baseNum = num > 10 && num < 20 ? num - 10 : num;
      const cheeks = `<ellipse cx="11" cy="24" rx="3.4" ry="2" fill="rgba(255,105,140,0.55)"/><ellipse cx="41" cy="24" rx="3.4" ry="2" fill="rgba(255,105,140,0.55)"/>`;
      const sleepMouth = `<ellipse cx="26" cy="26.5" rx="3" ry="2.4" fill="#1e293b"/>`;
      const smile = (stroke = "#1e293b", fill = "none") =>
        fill === "none"
          ? `<path d="M19 24.5 Q26 30.5 33 24.5" fill="none" stroke="${stroke}" stroke-width="2.4" stroke-linecap="round"/>`
          : `<path d="M18 23.5 Q26 31.5 34 23.5 Z" fill="${fill}" stroke="${stroke}" stroke-width="1.8" stroke-linejoin="round"/>`;

      let eyesMarkup = "";
      let mouthMarkup = isSleeping ? sleepMouth : smile();

      if (baseNum === 1) {
        eyesMarkup = isSleeping
          ? `<path d="M18 15 Q26 21 34 15" fill="none" stroke="#1e293b" stroke-width="2.8" stroke-linecap="round"/>`
          : `<circle cx="26" cy="14" r="8.2" fill="#fff" stroke="#1e293b" stroke-width="1.6"/>
             <circle cx="26" cy="14" r="4.3" fill="#1e293b"/>
             <circle cx="24.2" cy="12" r="1.5" fill="#fff"/>`;
        if (!isSleeping) mouthMarkup = smile("#9b1b26", "#ffccd5");
      } else if (baseNum === 2) {
        const frame = `<circle cx="17" cy="14" r="7.4" fill="${isSleeping ? "rgba(255,255,255,0.22)" : "#fff"}" stroke="#7b2cbf" stroke-width="2.8"/>
          <circle cx="35" cy="14" r="7.4" fill="${isSleeping ? "rgba(255,255,255,0.22)" : "#fff"}" stroke="#7b2cbf" stroke-width="2.8"/>
          <line x1="24.2" y1="14" x2="27.8" y2="14" stroke="#7b2cbf" stroke-width="2.8"/>`;
        eyesMarkup = isSleeping
          ? `${frame}<path d="M13 15 Q17 18.5 21 15" fill="none" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round"/><path d="M31 15 Q35 18.5 39 15" fill="none" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round"/>`
          : `${frame}<circle cx="17.5" cy="14" r="3.2" fill="#1e293b"/><circle cx="34.5" cy="14" r="3.2" fill="#1e293b"/>`;
        if (!isSleeping) mouthMarkup = smile("#5a189a", "#f472b6");
      } else if (baseNum === 4 || baseNum === 9) {
        const browColor = baseNum === 4 ? "#14532d" : "#334155";
        const brows = `<rect x="10.5" y="5" width="12" height="4.2" rx="1.2" fill="${browColor}"/><rect x="29.5" y="5" width="12" height="4.2" rx="1.2" fill="${browColor}"/>`;
        eyesMarkup = isSleeping
          ? `${brows}<path d="M12 16.5 Q16.5 20.5 21 16.5" fill="none" stroke="#1e293b" stroke-width="2.4" stroke-linecap="round"/><path d="M31 16.5 Q35.5 20.5 40 16.5" fill="none" stroke="#1e293b" stroke-width="2.4" stroke-linecap="round"/>`
          : `${brows}<rect x="11.5" y="10.5" width="10" height="9.5" rx="2.2" fill="#fff" stroke="#1e293b" stroke-width="1.4"/><circle cx="16.5" cy="15.2" r="2.7" fill="#1e293b"/><rect x="30.5" y="10.5" width="10" height="9.5" rx="2.2" fill="#fff" stroke="#1e293b" stroke-width="1.4"/><circle cx="35.5" cy="15.2" r="2.7" fill="#1e293b"/>`;
        if (!isSleeping) mouthMarkup = smile(browColor, baseNum === 4 ? "#bbf7d0" : "#e2e8f0");
      } else if (baseNum === 5) {
        const star = `<polygon points="16.5,2.5 19.6,9.2 26.8,10.1 21.4,15 22.8,22.2 16.5,18.7 10.2,22.2 11.6,15 6.2,10.1 13.4,9.2" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="1.2"/>`;
        eyesMarkup = isSleeping
          ? `${star}<path d="M12.8 14 Q16.5 17.2 20.2 14" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><path d="M31 15 Q35.5 19 40 15" fill="none" stroke="#1e293b" stroke-width="2.4" stroke-linecap="round"/>`
          : `${star}<circle cx="16.5" cy="13.5" r="4.5" fill="#fff"/><circle cx="16.5" cy="13.5" r="2.3" fill="#1e293b"/><circle cx="35.5" cy="13.5" r="5.5" fill="#fff" stroke="#1d4ed8" stroke-width="2"/><circle cx="35.5" cy="13.5" r="2.7" fill="#1e293b"/>`;
        if (!isSleeping) mouthMarkup = smile("#1e3a8a", "#f472b6");
      } else if (baseNum === 8) {
        const mask = `<path d="M7 10 Q16 6 26 11 Q36 6 45 10 Q46 18 41 21 Q34 22 26 17 Q18 22 11 21 Q6 18 7 10 Z" fill="#9d174d"/>`;
        eyesMarkup = isSleeping
          ? `${mask}<path d="M12.5 15 Q16.5 18 20.5 15" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><path d="M31.5 15 Q35.5 18 39.5 15" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>`
          : `${mask}<circle cx="16.5" cy="14.2" r="4.6" fill="#fff"/><circle cx="16.5" cy="14.2" r="2.4" fill="#1e293b"/><circle cx="35.5" cy="14.2" r="4.6" fill="#fff"/><circle cx="35.5" cy="14.2" r="2.4" fill="#1e293b"/>`;
        if (!isSleeping) mouthMarkup = smile("#500724", "#fbcfe8");
      } else if (num === 10 || num === 20) {
        const sc = num === 20 ? "#ea580c" : "#e63946";
        const starL = `<polygon points="16,3.5 18.8,9.5 25.2,10.2 20.4,14.6 21.7,21 16,17.8 10.3,21 11.6,14.6 6.8,10.2 13.2,9.5" fill="${sc}"/>`;
        const starR = `<polygon points="36,3.5 38.8,9.5 45.2,10.2 40.4,14.6 41.7,21 36,17.8 30.3,21 31.6,14.6 26.8,10.2 33.2,9.5" fill="${sc}"/>`;
        eyesMarkup = isSleeping
          ? `${starL}${starR}<path d="M12.5 13.8 Q16 16.8 19.5 13.8" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round"/><path d="M32.5 13.8 Q36 16.8 39.5 13.8" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round"/>`
          : `${starL}${starR}<circle cx="16" cy="13.2" r="4.1" fill="#fff"/><circle cx="16" cy="13.2" r="2.1" fill="#1e293b"/><circle cx="36" cy="13.2" r="4.1" fill="#fff"/><circle cx="36" cy="13.2" r="2.1" fill="#1e293b"/>`;
        if (!isSleeping) mouthMarkup = smile("#b91c1c", "#fecdd3");
      } else {
        eyesMarkup = isSleeping
          ? `<path d="M12 15.5 Q17 19.5 22 15.5" fill="none" stroke="#1e293b" stroke-width="2.4" stroke-linecap="round"/><path d="M30 15.5 Q35 19.5 40 15.5" fill="none" stroke="#1e293b" stroke-width="2.4" stroke-linecap="round"/>`
          : `<circle cx="17" cy="14" r="5.5" fill="#fff" stroke="#1e293b" stroke-width="1.4"/><circle cx="17" cy="14" r="2.7" fill="#1e293b"/><circle cx="15.8" cy="12.8" r="1" fill="#fff"/><circle cx="35" cy="14" r="5.5" fill="#fff" stroke="#1e293b" stroke-width="1.4"/><circle cx="35" cy="14" r="2.7" fill="#1e293b"/><circle cx="33.8" cy="12.8" r="1" fill="#fff"/>`;
        if (!isSleeping) mouthMarkup = smile("#1e293b", "#fecdd3");
      }
      return `<svg viewBox="0 0 52 34" aria-hidden="true">${eyesMarkup}${cheeks}${mouthMarkup}</svg>`;
    }

    function buildArms(num, data) {
      const arms = document.createElement("div");
      arms.className = "nb-arms";
      if (num === 8) {
        [24, 42, 60, 78].forEach((pct, idx) => {
          const left = document.createElement("div");
          left.className = "nb-arm left";
          left.style.background = data.armColor;
          left.style.top = `${pct}%`;
          left.style.transform = `translateY(-50%) rotate(${-28 + idx * 14}deg)`;
          const right = document.createElement("div");
          right.className = "nb-arm right";
          right.style.background = data.armColor;
          right.style.top = `${pct}%`;
          right.style.transform = `translateY(-50%) rotate(${28 - idx * 14}deg)`;
          arms.appendChild(left);
          arms.appendChild(right);
        });
        return arms;
      }
      const left = document.createElement("div");
      left.className = "nb-arm left";
      left.style.background = data.armColor;
      left.style.top = num === 1 ? "56%" : "42%";
      const right = document.createElement("div");
      right.className = num === 5 ? "nb-arm wave-right" : "nb-arm right";
      right.style.background = data.armColor;
      if (num !== 5) right.style.top = num === 1 ? "56%" : "42%";
      if (num === 5) {
        right.innerHTML = `<svg class="nb-glove" viewBox="0 0 28 28" aria-hidden="true"><path d="M7 18 L5 11 Q5 9 7 9 Q8.5 9 9 12 L10 5 Q10.5 3.5 12 4 Q13.5 4.5 13 11 L15 4 Q16 2.5 17.5 3.5 Q18.8 4.5 17.5 11 L20 6 Q21.5 5 22.5 6.5 Q23.2 8 20.5 13 L23 11.5 Q25 11 25 13 Q24.5 15 20 18 L18 23 Q13 25 8 22 Z" fill="#2563eb" stroke="#1e3a8a" stroke-width="1.3"/></svg>`;
      }
      arms.appendChild(left);
      arms.appendChild(right);
      return arms;
    }

    function buildNumberblock(num, isSleepingInBed, arrayDims = null) {
      const data = NUMBER_DATA[num];
      const wrapper = document.createElement("div");
      wrapper.className = isSleepingInBed ? "in-bed-nb" : "draggable-item";
      wrapper.dataset.id = String(num);
      wrapper.dataset.uid = `${num}_${Math.random().toString(36).slice(2, 7)}`;

      if (!isSleepingInBed) {
        const label = document.createElement("div");
        label.className = "nb-label num-text";
        label.textContent = num;
        wrapper.appendChild(label);
      }

      const body = document.createElement("div");
      body.className = "nb-body";

      const topAcc = buildTopAccessory(num);
      if (topAcc) body.insertAdjacentHTML("beforeend", topAcc);
      if (!isSleepingInBed) body.appendChild(buildArms(num, data));

      // Special Shape-Shifter Array Grid Layout
      if (arrayDims && !isSleepingInBed) {
        const [rows, cols] = arrayDims;
        const grid = document.createElement("div");
        grid.className = "blocks-grid-stack";
        grid.style.gridTemplateColumns = `repeat(${cols}, auto)`;
        if (data.border) grid.style.borderColor = data.border;
        for (let i = 0; i < num; i++) {
          const c = document.createElement("div");
          c.className = "array-cube";
          c.style.background = data.colors[i % data.colors.length];
          if (i === 0) {
            c.innerHTML = `<div class="face">${buildFaceSVG(num, false)}</div>`;
          }
          grid.appendChild(c);
        }
        body.appendChild(grid);
      } else if (num > 10) {
        // Place Value 11–20: Ten Column + Ones Column (or two Tens for 20)
        const colsWrap = document.createElement("div");
        colsWrap.className = `nb-columns-wrap ${isSleepingInBed ? "in-bed-teen" : "teen-col"}`;

        const tenStack = document.createElement("div");
        tenStack.className = isSleepingInBed ? "in-bed-stack" : "blocks-stack";
        tenStack.style.borderColor = num === 20 ? "#ea580c" : "#e63946";
        for (let i = 0; i < 10; i++) {
          const c = document.createElement("div");
          c.className = isSleepingInBed ? "in-bed-cube" : "unit-cube";
          c.style.background = num === 20 ? "#fed7aa" : "#ffffff";
          if (i === 9) {
            c.classList.add("head-cube");
            c.innerHTML = `<div class="face">${buildFaceSVG(num, isSleepingInBed)}</div>`;
          }
          tenStack.appendChild(c);
        }
        colsWrap.appendChild(tenStack);

        const onesCount = num === 20 ? 10 : num - 10;
        const onesStack = document.createElement("div");
        onesStack.className = isSleepingInBed ? "in-bed-stack" : "blocks-stack";
        if (num === 20) onesStack.style.borderColor = "#ea580c";
        for (let i = 0; i < onesCount; i++) {
          const c = document.createElement("div");
          c.className = isSleepingInBed ? "in-bed-cube" : "unit-cube";
          c.style.background = data.colors[i % data.colors.length];
          onesStack.appendChild(c);
        }
        colsWrap.appendChild(onesStack);
        body.appendChild(colsWrap);
      } else {
        // Standard 1–10 vertical stack
        const stack = document.createElement("div");
        stack.className = isSleepingInBed ? "in-bed-stack" : "blocks-stack";
        if (data.border) stack.style.borderColor = data.border;
        for (let i = 0; i < num; i++) {
          const cube = document.createElement("div");
          cube.className = isSleepingInBed ? "in-bed-cube" : "unit-cube";
          cube.style.background = data.colors[i % data.colors.length];
          if (i === num - 1) {
            cube.classList.add("head-cube");
            cube.innerHTML = `<div class="face">${buildFaceSVG(num, isSleepingInBed)}</div>`;
          } else if (!isSleepingInBed && num === 3 && i === 1) {
            cube.innerHTML = `<div class="three-buttons"><span class="three-btn"></span><span class="three-btn"></span><span class="three-btn"></span></div>`;
          } else if (!isSleepingInBed && num === 6 && i === 2) {
            cube.innerHTML = `<div class="dice-pips"><span class="dice-pip"></span><span class="dice-pip"></span><span class="dice-pip"></span><span class="dice-pip"></span></div>`;
          } else if (!isSleepingInBed && num === 6 && i === 1) {
            cube.innerHTML = `<div class="dice-pips"><span class="dice-pip"></span><span class="dice-pip"></span></div>`;
          }
          stack.appendChild(cube);
        }
        body.appendChild(stack);
      }

      if (!isSleepingInBed) {
        const shoes = document.createElement("div");
        shoes.className = "nb-shoes";
        shoes.innerHTML = `<span class="nb-shoe" style="background:${data.shoeColor}"></span><span class="nb-shoe" style="background:${data.shoeColor}"></span>`;
        body.appendChild(shoes);
      }

      wrapper.appendChild(body);
      return wrapper;
    }

    /* ===========================
       BOARD ROUTER
       =========================== */
    function resetBoard() {
      matchedCount = 0;
      selectedId = null;
      selectedUid = null;
      activeDrag = null;
      document.body.classList.remove("lights-out");
      document.getElementById("celebration").classList.remove("visible");

      const targetsArea = document.getElementById("targetsArea");
      const playground = document.getElementById("playground");
      targetsArea.innerHTML = "";
      playground.innerHTML = "";
      playground.classList.remove("scroll-left");

      document.getElementById("roundPill").textContent = `⭐ ${adventureRound} / ${ADVENTURE_TOTAL_ROUNDS}`;

      if (gameMode === "shapes") return renderShapesMode(targetsArea, playground);
      if (gameMode === "bed") return renderBedMode(targetsArea, playground);
      if (gameMode === "train") return renderTrainMode(targetsArea, playground);
      if (gameMode === "snack") return renderSnackMode(targetsArea, playground);
      if (gameMode === "team") return renderTeamMode(targetsArea, playground);
      if (gameMode === "pattern") return renderPatternTrainMode(targetsArea, playground);
      if (gameMode === "seesaw") return renderSeesawMode(targetsArea, playground);
      if (gameMode === "split") return renderSplitMode(targetsArea, playground);
      if (gameMode === "shifter") return renderShifterMode(targetsArea, playground);
    }

    /* ===========================
       CLASSIC MATCHING MODES
       =========================== */
    function renderShapesMode(targetsArea, playground) {
      const count = rangeMode === "5" ? 5 : 8;
      totalTargets = count;
      const chosen = SHAPES_DATA.slice(0, count);
      const targetList = shuffleTargets ? shuffle(chosen) : chosen;

      targetList.forEach(shape => {
        const card = document.createElement("div");
        card.className = "target-card";
        card.dataset.id = shape.id;
        card.innerHTML = `
          <svg viewBox="0 0 100 100" width="90" height="90" style="fill: rgba(255,255,255,0.12); stroke: rgba(255,255,255,0.55); stroke-width: 4; stroke-dasharray: 6 4;">
            ${shape.svg}
          </svg>
          <div class="target-badge num-text">${shape.name}</div>
        `;
        bindClassicTargetTap(card, shape.id);
        targetsArea.appendChild(card);
      });

      shuffle(chosen).forEach(shape => {
        const item = document.createElement("div");
        item.className = "draggable-item";
        item.dataset.id = shape.id;
        item.dataset.uid = shape.id;
        item.innerHTML = `<svg viewBox="0 0 100 100" width="90" height="90" style="fill: ${shape.color}; filter: drop-shadow(0 6px 12px rgba(0,0,0,0.4));">${shape.svg}</svg>`;
        attachDragAndTap(item, shape.id, () => speak(shape.name, `shape_${shape.id}`));
        playground.appendChild(item);
      });
    }

    function renderBedMode(targetsArea, playground) {
      const numbers = getCurrentNumberList();
      totalTargets = numbers.length;
      const targetNums = shuffleTargets ? shuffle(numbers) : numbers;

      targetNums.forEach(num => {
        const data = NUMBER_DATA[num];
        const bed = document.createElement("div");
        bed.className = "bed";
        bed.dataset.id = String(num);

        const pillow = document.createElement("div");
        pillow.className = "pillow";
        pillow.appendChild(buildSubitizeDots(num));

        const mattress = document.createElement("div");
        mattress.className = "bed-mattress";

        const blanket = document.createElement("div");
        blanket.className = "blanket";
        blanket.style.background = data.blanket;
        blanket.innerHTML = `<span class="num-text">${num}</span>`;

        const zzz = document.createElement("div");
        zzz.className = "zzz";
        zzz.textContent = "Zzz";

        bed.appendChild(zzz);
        bed.appendChild(pillow);
        bed.appendChild(mattress);
        bed.appendChild(blanket);

        bindClassicTargetTap(bed, String(num));
        targetsArea.appendChild(bed);
      });

      renderNumberPlayground(playground, numbers);
    }

    function renderTrainMode(targetsArea, playground) {
      const numbers = getCurrentNumberList();
      totalTargets = numbers.length;
      const targetNums = shuffleTargets ? shuffle(numbers) : numbers;

      const scene = document.createElement("div");
      scene.className = "train-scene";
      const scrollWrap = document.createElement("div");
      scrollWrap.className = `train-scroll-wrap ${numbers.length > 5 ? "wide-train" : ""}`;
      const consist = document.createElement("div");
      consist.className = "train-consist";
      consist.id = "trainConsist";

      consist.innerHTML = `<div class="train-tracks"></div>${buildLocomotiveSVG()}`;

      targetNums.forEach(num => {
        const coupler = document.createElement("div");
        coupler.className = "train-coupler";
        consist.appendChild(coupler);

        const car = document.createElement("div");
        car.className = "target-card train-car-v2";
        car.dataset.id = String(num);
        car.innerHTML = `
          <div class="train-car-stripe"></div>
          <div class="target-slot" style="flex:1;display:flex;align-items:flex-end;justify-content:center;z-index:2;"></div>
          <div class="target-badge"><span class="num-text">${num}</span></div>
          <div class="train-wheels"><span class="t-wheel"></span><span class="t-wheel"></span></div>
        `;
        const dots = buildSubitizeDots(num);
        dots.classList.add("hard-only");
        dots.style.transform = "scale(0.85)";
        car.querySelector(".target-badge").appendChild(dots);
        bindClassicTargetTap(car, String(num));
        consist.appendChild(car);
      });

      scrollWrap.appendChild(consist);
      scene.appendChild(scrollWrap);
      targetsArea.appendChild(scene);

      renderNumberPlayground(playground, numbers);
    }

    function renderSnackMode(targetsArea, playground) {
      const numbers = getCurrentNumberList();
      totalTargets = numbers.length;
      const targetNums = shuffleTargets ? shuffle(numbers) : numbers;

      targetNums.forEach(num => {
        const data = NUMBER_DATA[num];
        const plate = document.createElement("div");
        plate.className = "target-card";
        plate.dataset.id = String(num);
        plate.innerHTML = `
          ${buildSnackHTML(num, data.food)}
          <div class="target-slot" style="min-height:36px;display:flex;align-items:center;justify-content:center;"></div>
          <div class="target-badge num-text">${num}</div>
        `;
        bindClassicTargetTap(plate, String(num));
        targetsArea.appendChild(plate);
      });

      renderNumberPlayground(playground, numbers);
    }

    function renderNumberPlayground(playground, numbers) {
      if (numbers.length > 6) playground.classList.add("scroll-left");
      shuffle(numbers).forEach(num => {
        const nb = buildNumberblock(num, false);
        attachDragAndTap(nb, String(num), () => {
          playCountChimes(num);
          speakNumber(num);
        });
        playground.appendChild(nb);
      });
    }

    function bindClassicTargetTap(targetEl, targetId) {
      targetEl.addEventListener("pointerdown", () => {
        if (!selectedId || targetEl.classList.contains("occupied")) return;
        if (selectedId === targetId) {
          completeClassicMatch(targetId, targetEl);
        } else {
          playTone(155, 0.25);
          speak("Not quite! Try another spot.", "try_another_spot");
        }
      });
    }

    function completeClassicMatch(id, targetEl) {
      const dragEl = document.querySelector(`.draggable-item[data-id="${id}"]:not([data-matched="true"])`);
      if (!dragEl || targetEl.classList.contains("occupied")) return;

      dragEl.dataset.matched = "true";
      dragEl.style.visibility = "hidden";
      selectedId = null;
      selectedUid = null;
      document.querySelectorAll(".draggable-item").forEach(i => i.classList.remove("selected"));
      targetEl.classList.add("occupied");

      playTone(523.25, 0.18, 0);
      playTone(659.25, 0.28, 0.13);

      if (gameMode === "bed") {
        const num = Number(id);
        targetEl.querySelector(".bed-mattress").appendChild(buildNumberblock(num, true));
        speak(`Goodnight ${NUMBER_DATA[num].name}!`, num <= 10 ? `bed_${num}` : null);
      } else if (gameMode === "train") {
        const num = Number(id);
        const rider = buildNumberblock(num, false);
        rider.style.transform = num > 10 ? "scale(0.5)" : "scale(0.56)";
        rider.style.transformOrigin = "bottom center";
        targetEl.querySelector(".target-slot").appendChild(rider);
        speak(`All aboard ${NUMBER_DATA[num].name}!`, num <= 10 ? `train_${num}` : null);
      } else if (gameMode === "snack") {
        const num = Number(id);
        const eater = buildNumberblock(num, false);
        eater.style.transform = "scale(0.42)";
        eater.style.transformOrigin = "bottom center";
        targetEl.querySelector(".target-slot").appendChild(eater);
        speak(`Yum! ${num} ${num === 1 ? "snack" : "snacks"} for ${NUMBER_DATA[num].name}!`, num <= 10 ? `snack_${num}` : null);
      } else if (gameMode === "shapes") {
        const shape = SHAPES_DATA.find(s => s.id === id);
        const svg = targetEl.querySelector("svg");
        svg.style.fill = shape.color;
        svg.style.stroke = "#ffffff";
        svg.style.strokeDasharray = "none";
        speak(`Great job! That's a ${shape.name}!`, `shape_match_${shape.id}`);
      }

      matchedCount++;
      if (matchedCount === totalTargets) handleRoundComplete();
    }

    /* ===========================
       ADVENTURE 1: TEAM UP (Addition & Number Bonds)
       =========================== */
    function renderTeamMode(targetsArea, playground) {
      const poolTargets = rangeMode === "5" ? [3, 4, 5] : rangeMode === "10" ? [5, 6, 7, 8, 9, 10] : [11, 12, 14, 15, 16, 18, 20];
      const target = poolTargets[(adventureRound - 1 + Math.floor(Math.random() * poolTargets.length)) % poolTargets.length];

      // Pick a guaranteed valid pair a + b = target
      const minA = rangeMode === "20" ? Math.max(2, target - 10) : 1;
      const maxA = Math.min(target - 1, rangeMode === "20" ? 10 : target - 1);
      const a = minA + Math.floor(Math.random() * (maxA - minA + 1));
      const b = target - a;

      teamState = { target, slotA: null, slotB: null, solved: false };

      const stage = document.createElement("div");
      stage.className = "adventure-stage";
      stage.innerHTML = `
        <div class="prompt-banner">🤝 Team up 2 Numberblocks to make <span style="color:var(--gold);font-size:1.35rem;" class="num-text">${target}</span>!</div>
        <div class="team-card">
          <div class="team-dots-bar" id="teamDotsBar"></div>
          <div class="team-slots-row">
            <div class="puzzle-drop" id="teamSlotA" data-drop="teamA"><span style="font-size:2rem;opacity:0.5;">?</span></div>
            <div class="math-op">+</div>
            <div class="puzzle-drop" id="teamSlotB" data-drop="teamB"><span style="font-size:2rem;opacity:0.5;">?</span></div>
            <div class="math-op">=</div>
            <div class="target-total-pill"><span class="num-text">${target}</span><span class="hard-only">🎯</span></div>
          </div>
        </div>
      `;
      targetsArea.appendChild(stage);
      updateTeamVisuals();

      // Tap slots to place selected or remove placed
      ["teamSlotA", "teamSlotB"].forEach(slotId => {
        const el = document.getElementById(slotId);
        el.addEventListener("pointerdown", () => {
          if (teamState.solved) return;
          const which = slotId === "teamSlotA" ? "slotA" : "slotB";
          if (selectedId) {
            handleTeamDrop(Number(selectedId), which);
          } else if (teamState[which] !== null) {
            teamState[which] = null;
            playTone(320, 0.15);
            updateTeamVisuals();
          }
        });
      });

      // Build playground options (a, b, plus 3-4 helpful choices)
      const choices = [a, b];
      const maxChoice = rangeMode === "5" ? 4 : 10;
      while (choices.length < 6) {
        const c = 1 + Math.floor(Math.random() * maxChoice);
        if (c < target && choices.filter(x => x === c).length < 2) choices.push(c);
      }

      shuffle(choices).forEach(num => {
        const nb = buildNumberblock(num, false);
        attachDragAndTap(nb, String(num), () => {
          playCountChimes(num);
          speakNumber(num);
        });
        playground.appendChild(nb);
      });

      speak(`Team up two Numberblocks to make ${NUMBER_DATA[target].name}!`);
    }

    function updateTeamVisuals() {
      const { target, slotA, slotB, solved } = teamState;
      const bar = document.getElementById("teamDotsBar");
      bar.innerHTML = "";
      const countA = slotA || 0;
      const countB = slotB || 0;
      for (let i = 0; i < target; i++) {
        const dot = document.createElement("div");
        dot.className = "team-dot";
        if (i < countA) {
          dot.classList.add("filled");
          dot.style.background = NUMBER_DATA[slotA].colors[0];
        } else if (i < countA + countB) {
          dot.classList.add("filled");
          dot.style.background = NUMBER_DATA[slotB].colors[0];
        }
        bar.appendChild(dot);
      }

      [["teamSlotA", slotA], ["teamSlotB", slotB]].forEach(([elId, val]) => {
        const el = document.getElementById(elId);
        el.className = `puzzle-drop ${val ? "filled" : ""} ${solved ? "solved" : ""}`;
        el.innerHTML = "";
        if (val) {
          const mini = buildNumberblock(val, false);
          mini.style.transform = val > 6 ? "scale(0.42)" : "scale(0.54)";
          mini.style.transformOrigin = "center center";
          mini.style.pointerEvents = "none";
          el.appendChild(mini);
        } else {
          el.innerHTML = `<span style="font-size:2rem;opacity:0.55;">?</span>`;
        }
      });
    }

    function handleTeamDrop(num, whichSlot) {
      if (teamState.solved) return;
      selectedId = null;
      document.querySelectorAll(".draggable-item").forEach(i => i.classList.remove("selected"));

      // Auto-pick empty slot if user dropped on occupied slot
      if (whichSlot === "auto") {
        whichSlot = teamState.slotA === null ? "slotA" : "slotB";
      }
      teamState[whichSlot] = num;
      updateTeamVisuals();

      const { target, slotA, slotB } = teamState;
      if (slotA !== null && slotB !== null) {
        const sum = slotA + slotB;
        if (sum === target) {
          teamState.solved = true;
          updateTeamVisuals();
          playSuccessChime();
          speak(`${NUMBER_DATA[slotA].name} plus ${NUMBER_DATA[slotB].name} makes ${NUMBER_DATA[target].name}!`);
          advanceAdventureRound();
        } else {
          playTone(155, 0.25);
          const hint = sum > target ? `${sum} is too big! Try a smaller block.` : `${sum} is too small! Try a bigger block.`;
          speak(hint);
          setTimeout(() => {
            if (!teamState.solved) {
              teamState[whichSlot] = null;
              updateTeamVisuals();
            }
          }, 850);
        }
      } else {
        const rem = target - num;
        playTone(440, 0.18);
        if (rem > 0) {
          speak(`${NUMBER_DATA[num].name}! How many more to make ${NUMBER_DATA[target].name}?`);
        } else {
          speak(`Oops! Pick a smaller block than ${NUMBER_DATA[target].name}.`);
          teamState[whichSlot] = null;
          updateTeamVisuals();
        }
      }
    }

    /* ===========================
       ADVENTURE 2: PATTERN TRAIN (Sequences, Countdowns, Evens/Odds)
       =========================== */
    function renderPatternTrainMode(targetsArea, playground) {
      let seq = [];
      let label = "";

      if (rangeMode === "5") {
        // 1-10 counting up or countdown
        const presets = [
          { seq: [1, 2, 3, 4, 5], label: "Count up! 1, 2, 3..." },
          { seq: [4, 5, 6, 7, 8], label: "Count up!" },
          { seq: [6, 7, 8, 9, 10], label: "Count up to 10!" },
          { seq: [5, 4, 3, 2, 1], label: "Countdown! 5, 4, 3..." },
          { seq: [10, 9, 8, 7, 6], label: "Countdown from 10!" }
        ];
        const pick = presets[(adventureRound - 1) % presets.length];
        seq = pick.seq; label = pick.label;
      } else if (rangeMode === "10") {
        // Evens & Odds!
        const presets = [
          { seq: [2, 4, 6, 8, 10], label: "Skip count by 2s (Evens)!" },
          { seq: [1, 3, 5, 7, 9],  label: "Odd numbers! 1, 3, 5..." },
          { seq: [10, 8, 6, 4, 2], label: "Count down by 2s!" },
          { seq: [2, 4, 6, 8, 10], label: "Even Numbers Express!" },
          { seq: [1, 3, 5, 7, 9],  label: "Odd Blocks Express!" }
        ];
        const pick = presets[(adventureRound - 1) % presets.length];
        seq = pick.seq; label = pick.label;
      } else {
        // 11-20 sequences
        const presets = [
          { seq: [11, 12, 13, 14, 15], label: "Teen numbers! 11, 12..." },
          { seq: [16, 17, 18, 19, 20], label: "Count up to 20!" },
          { seq: [12, 14, 16, 18, 20], label: "Even teens! +2" },
          { seq: [15, 14, 13, 12, 11], label: "Teen countdown!" },
          { seq: [11, 13, 15, 17, 19], label: "Odd teens! +2" }
        ];
        const pick = presets[(adventureRound - 1) % presets.length];
        seq = pick.seq; label = pick.label;
      }

      // Pick 2 missing indices (never all adjacent at the very start so the pattern is clear)
      const missingIdx = shuffle([1, 2, 3, 4]).slice(0, 2);
      const missingNums = missingIdx.map(i => seq[i]);
      patternState = { seq, missingIdx, filledCount: 0, totalMissing: missingIdx.length };

      const scene = document.createElement("div");
      scene.className = "train-scene";
      scene.innerHTML = `<div class="train-hint-banner">🔢 ${label}</div>`;

      const scrollWrap = document.createElement("div");
      scrollWrap.className = "train-scroll-wrap";
      const consist = document.createElement("div");
      consist.className = "train-consist";
      consist.id = "trainConsist";
      consist.innerHTML = `<div class="train-tracks"></div>${buildLocomotiveSVG()}`;

      seq.forEach((num, idx) => {
        const coupler = document.createElement("div");
        coupler.className = "train-coupler";
        consist.appendChild(coupler);

        const isMissing = missingIdx.includes(idx);
        const car = document.createElement("div");
        car.className = `target-card train-car-v2 ${isMissing ? "missing-slot" : "prefilled occupied"}`;
        car.dataset.id = String(num);
        car.dataset.drop = isMissing ? "patternCar" : "";
        car.innerHTML = `
          <div class="train-car-stripe"></div>
          <div class="target-slot" style="flex:1;display:flex;align-items:flex-end;justify-content:center;z-index:2;"></div>
          <div class="target-badge">${isMissing ? "?" : `<span class="num-text">${num}</span>`}</div>
          <div class="train-wheels"><span class="t-wheel"></span><span class="t-wheel"></span></div>
        `;
        if (!isMissing) {
          const rider = buildNumberblock(num, false);
          rider.style.transform = num > 10 ? "scale(0.5)" : "scale(0.56)";
          rider.style.transformOrigin = "bottom center";
          rider.style.pointerEvents = "none";
          car.querySelector(".target-slot").appendChild(rider);
        } else {
          car.addEventListener("pointerdown", () => {
            if (!selectedId || car.classList.contains("occupied")) return;
            handlePatternDrop(Number(selectedId), car);
          });
        }
        consist.appendChild(car);
      });

      scrollWrap.appendChild(consist);
      scene.appendChild(scrollWrap);
      targetsArea.appendChild(scene);

      // Playground: missing numbers + 3 distractors from nearby range
      const choices = [...missingNums];
      const minP = rangeMode === "20" ? 11 : 1;
      const maxP = rangeMode === "20" ? 20 : 10;
      while (choices.length < 5) {
        const c = minP + Math.floor(Math.random() * (maxP - minP + 1));
        if (!choices.includes(c)) choices.push(c);
      }

      shuffle(choices).forEach(num => {
        const nb = buildNumberblock(num, false);
        attachDragAndTap(nb, String(num), () => {
          playCountChimes(num);
          speakNumber(num);
        });
        playground.appendChild(nb);
      });

      speak(`${label} Fill in the missing train cars!`);
    }

    function handlePatternDrop(num, carEl) {
      if (carEl.classList.contains("occupied")) return;
      if (Number(carEl.dataset.id) === num) {
        const dragEl = document.querySelector(`.draggable-item[data-id="${num}"]:not([data-matched="true"])`);
        if (dragEl) {
          dragEl.dataset.matched = "true";
          dragEl.style.visibility = "hidden";
        }
        selectedId = null;
        document.querySelectorAll(".draggable-item").forEach(i => i.classList.remove("selected"));

        carEl.classList.remove("missing-slot");
        carEl.classList.add("occupied");
        const rider = buildNumberblock(num, false);
        rider.style.transform = num > 10 ? "scale(0.5)" : "scale(0.56)";
        rider.style.transformOrigin = "bottom center";
        rider.style.pointerEvents = "none";
        carEl.querySelector(".target-slot").appendChild(rider);
        carEl.querySelector(".target-badge").innerHTML = `<span class="num-text">${num}</span>`;

        playSuccessChime();
        speak(`Yes! ${NUMBER_DATA[num].name}!`);
        patternState.filledCount++;

        if (patternState.filledCount === patternState.totalMissing) {
          setTimeout(() => {
            playTrainWhistle();
            document.getElementById("trainConsist")?.classList.add("train-departing");
          }, 350);
          advanceAdventureRound(1900);
        }
      } else {
        playTone(155, 0.25);
        speak("Look at the pattern and try another Numberblock!");
      }
    }

    /* ===========================
       ADVENTURE 3: BALANCE SEESAW (Equivalence & Doubles)
       =========================== */
    function renderSeesawMode(targetsArea, playground) {
      const pool = rangeMode === "5" ? [3, 4, 5] : rangeMode === "10" ? [6, 7, 8, 9, 10] : [12, 14, 15, 16, 18];
      const leftTarget = pool[(adventureRound - 1 + Math.floor(Math.random() * pool.length)) % pool.length];
      seesawState = { leftTarget, rightBlocks: [], solved: false };

      const stage = document.createElement("div");
      stage.className = "adventure-stage";
      stage.innerHTML = `
        <div class="prompt-banner">⚖️ Balance the seesaw to equal <span style="color:var(--gold);" class="num-text">${leftTarget}</span>! (Tap a block on the right to remove)</div>
        <div class="seesaw-wrap">
          <div class="seesaw-sign" id="seesawSign">&gt;</div>
          <div class="seesaw-beam" id="seesawBeam">
            <div class="seesaw-pan left-pan" id="seesawLeft">
              <div class="pan-total num-text">${leftTarget}</div>
            </div>
            <div class="seesaw-pan right-pan" id="seesawRight" data-drop="seesawRight">
              <div class="pan-total num-text" id="rightPanTotal">0</div>
            </div>
          </div>
          <div class="seesaw-fulcrum"></div>
        </div>
      `;
      targetsArea.appendChild(stage);

      const leftNB = buildNumberblock(leftTarget, false);
      leftNB.style.transform = leftTarget > 10 ? "scale(0.55)" : "scale(0.62)";
      leftNB.style.transformOrigin = "bottom center";
      leftNB.style.pointerEvents = "none";
      document.getElementById("seesawLeft").appendChild(leftNB);

      const rightPan = document.getElementById("seesawRight");
      rightPan.addEventListener("pointerdown", (e) => {
        if (seesawState.solved) return;
        if (selectedId) {
          addSeesawBlock(Number(selectedId));
        }
      });

      // Playground: exclude exact leftTarget so he combines 2+ blocks (e.g., doubles or bonds!)
      const half = Math.floor(leftTarget / 2);
      const choices = leftTarget % 2 === 0 ? [half, half] : [half, leftTarget - half];
      const maxC = rangeMode === "5" ? 4 : 9;
      while (choices.length < 6) {
        const c = 1 + Math.floor(Math.random() * maxC);
        if (c < leftTarget && choices.filter(x => x === c).length < 2) choices.push(c);
      }

      shuffle(choices).forEach(num => {
        const nb = buildNumberblock(num, false);
        attachDragAndTap(nb, String(num), () => {
          playCountChimes(num);
          speakNumber(num);
        });
        playground.appendChild(nb);
      });

      updateSeesawPhysics();
      speak(`Balance the seesaw! Make ${NUMBER_DATA[leftTarget].name} on the right side!`);
    }

    function addSeesawBlock(num) {
      if (seesawState.solved) return;
      if (seesawState.rightBlocks.length >= 3) {
        speak("Tap a block on the seesaw to take it off first!");
        return;
      }
      selectedId = null;
      document.querySelectorAll(".draggable-item").forEach(i => i.classList.remove("selected"));
      seesawState.rightBlocks.push(num);
      updateSeesawPhysics();

      const sum = seesawState.rightBlocks.reduce((s, n) => s + n, 0);
      if (sum === seesawState.leftTarget) {
        seesawState.solved = true;
        document.getElementById("seesawRight").classList.add("balanced");
        playSuccessChime();
        const isDouble = seesawState.rightBlocks.length === 2 && seesawState.rightBlocks[0] === seesawState.rightBlocks[1];
        const eqText = seesawState.rightBlocks.map(n => NUMBER_DATA[n].name).join(" plus ");
        speak(`Balanced! ${eqText} equals ${NUMBER_DATA[seesawState.leftTarget].name}!${isDouble ? " That's a double!" : ""}`);
        advanceAdventureRound();
      } else if (sum > seesawState.leftTarget) {
        playTone(155, 0.25);
        speak("Too heavy! Tap a block on the seesaw to take it off.");
      } else {
        playTone(440, 0.16);
      }
    }

    function updateSeesawPhysics() {
      const { leftTarget, rightBlocks } = seesawState;
      const rightSum = rightBlocks.reduce((s, n) => s + n, 0);
      const diff = rightSum - leftTarget;
      const angle = Math.max(-14, Math.min(14, diff * 3.2));

      document.getElementById("seesawBeam").style.transform = `rotate(${angle}deg)`;
      document.getElementById("seesawSign").textContent = diff === 0 ? "=" : diff < 0 ? ">" : "<";

      const rightPan = document.getElementById("seesawRight");
      rightPan.innerHTML = `<div class="pan-total num-text">${rightSum}</div>`;
      rightBlocks.forEach((num, idx) => {
        const nb = buildNumberblock(num, false);
        nb.style.transform = "scale(0.5)";
        nb.style.transformOrigin = "bottom center";
        nb.style.cursor = "pointer";
        nb.addEventListener("pointerdown", (e) => {
          e.stopPropagation();
          if (seesawState.solved) return;
          seesawState.rightBlocks.splice(idx, 1);
          playTone(300, 0.14);
          updateSeesawPhysics();
        });
        rightPan.appendChild(nb);
      });
    }

    /* ===========================
       ADVENTURE 4: SPLIT & SHARE (Halving & Subtraction)
       =========================== */
    function renderSplitMode(targetsArea, playground) {
      const isHalving = adventureRound % 2 === 1; // alternate equal halves & missing part!
      const evenPool = rangeMode === "5" ? [2, 4] : rangeMode === "10" ? [4, 6, 8, 10] : [12, 14, 16, 18, 20];
      const anyPool  = rangeMode === "5" ? [3, 4, 5] : rangeMode === "10" ? [5, 6, 7, 8, 9, 10] : [11, 12, 14, 15, 16, 18];

      const whole = isHalving
        ? evenPool[Math.floor(Math.random() * evenPool.length)]
        : anyPool[Math.floor(Math.random() * anyPool.length)];

      const knownLeft = isHalving ? null : Math.max(1, Math.min(whole - 1, rangeMode === "20" ? whole - (2 + Math.floor(Math.random() * 8)) : 1 + Math.floor(Math.random() * (whole - 1))));
      const answerRight = isHalving ? whole / 2 : whole - knownLeft;

      splitState = { whole, isHalving, left: knownLeft, right: null, solved: false };

      const promptText = isHalving
        ? `✂️ Split <span style="color:var(--gold);" class="num-text">${whole}</span> into two EQUAL halves!`
        : `✂️ Split <span style="color:var(--gold);" class="num-text">${whole}</span>! <span class="num-text">${whole} − ${knownLeft} = ?</span>`;

      const stage = document.createElement("div");
      stage.className = "adventure-stage";
      stage.innerHTML = `
        <div class="prompt-banner">${promptText}</div>
        <div class="split-stage">
          <div class="split-parent-box" id="splitParentBox"></div>
          <div class="split-arrows">↙ ↘</div>
          <div class="team-slots-row">
            <div class="puzzle-drop" id="splitLeft" data-drop="splitLeft"></div>
            <div class="math-op">${isHalving ? "=" : "+"}</div>
            <div class="puzzle-drop" id="splitRight" data-drop="splitRight"></div>
          </div>
        </div>
      `;
      targetsArea.appendChild(stage);

      const parentNB = buildNumberblock(whole, false);
      parentNB.style.transform = whole > 10 ? "scale(0.5)" : "scale(0.58)";
      parentNB.style.transformOrigin = "center center";
      parentNB.style.pointerEvents = "none";
      document.getElementById("splitParentBox").appendChild(parentNB);

      updateSplitVisuals();

      ["splitLeft", "splitRight"].forEach(id => {
        document.getElementById(id).addEventListener("pointerdown", () => {
          if (splitState.solved) return;
          const side = id === "splitLeft" ? "left" : "right";
          if (!splitState.isHalving && side === "left") return; // locked known part
          if (selectedId) {
            handleSplitDrop(Number(selectedId), side);
          } else if (splitState[side] !== null) {
            splitState[side] = null;
            updateSplitVisuals();
          }
        });
      });

      const choices = isHalving ? [answerRight, answerRight] : [answerRight];
      const maxC = rangeMode === "5" ? 4 : 10;
      while (choices.length < 6) {
        const c = 1 + Math.floor(Math.random() * maxC);
        if (c < whole && choices.filter(x => x === c).length < 2) choices.push(c);
      }

      shuffle(choices).forEach(num => {
        const nb = buildNumberblock(num, false);
        attachDragAndTap(nb, String(num), () => {
          playCountChimes(num);
          speakNumber(num);
        });
        playground.appendChild(nb);
      });

      speak(isHalving
        ? `Split ${NUMBER_DATA[whole].name} into two equal halves!`
        : `${NUMBER_DATA[whole].name} splits into ${NUMBER_DATA[knownLeft].name} and what?`);
    }

    function updateSplitVisuals() {
      const { left, right, solved } = splitState;
      [["splitLeft", left], ["splitRight", right]].forEach(([elId, val]) => {
        const el = document.getElementById(elId);
        el.className = `puzzle-drop ${val ? "filled" : ""} ${solved ? "solved" : ""}`;
        el.innerHTML = "";
        if (val) {
          const mini = buildNumberblock(val, false);
          mini.style.transform = val > 8 ? "scale(0.42)" : "scale(0.54)";
          mini.style.transformOrigin = "center center";
          mini.style.pointerEvents = "none";
          el.appendChild(mini);
        } else {
          el.innerHTML = `<span style="font-size:2rem;opacity:0.55;">?</span>`;
        }
      });
    }

    function handleSplitDrop(num, side) {
      if (splitState.solved) return;
      if (!splitState.isHalving) side = "right";
      else if (side === "auto") side = splitState.left === null ? "left" : "right";

      selectedId = null;
      document.querySelectorAll(".draggable-item").forEach(i => i.classList.remove("selected"));
      splitState[side] = num;
      updateSplitVisuals();

      const { whole, isHalving, left, right } = splitState;
      if (left !== null && right !== null) {
        const ok = isHalving ? (left === right && left + right === whole) : (left + right === whole);
        if (ok) {
          splitState.solved = true;
          updateSplitVisuals();
          playSuccessChime();
          speak(`Awesome! ${NUMBER_DATA[whole].name} splits into ${NUMBER_DATA[left].name} and ${NUMBER_DATA[right].name}!`);
          advanceAdventureRound();
        } else {
          playTone(155, 0.25);
          speak(isHalving && left !== right ? "Make both halves the same!" : "Try another Numberblock!");
          setTimeout(() => {
            if (!splitState.solved) {
              splitState[side] = null;
              updateSplitVisuals();
            }
          }, 800);
        }
      } else {
        playTone(440, 0.16);
      }
    }

    /* ===========================
       ADVENTURE 5: SHAPE-SHIFTER (Arrays, Factors & Squares)
       =========================== */
    function renderShifterMode(targetsArea, playground) {
      const easyPuzzles = [
        { num: 4,  dims: [2, 2], label: "2 × 2 Square!" },
        { num: 6,  dims: [2, 3], label: "2 rows of 3!" },
        { num: 8,  dims: [2, 4], label: "2 rows of 4!" },
        { num: 9,  dims: [3, 3], label: "3 × 3 Square!" },
        { num: 10, dims: [2, 5], label: "2 rows of 5!" }
      ];
      const bigPuzzles = [
        { num: 6,  dims: [3, 2], label: "3 rows of 2!" },
        { num: 9,  dims: [3, 3], label: "3 × 3 Square!" },
        { num: 12, dims: [3, 4], label: "3 rows of 4!" },
        { num: 15, dims: [3, 5], label: "3 rows of 5!" },
        { num: 16, dims: [4, 4], label: "4 × 4 Super Square!" }
      ];

      const list = rangeMode === "5" ? easyPuzzles : bigPuzzles;
      const puzzle = list[(adventureRound - 1) % list.length];
      const [rows, cols] = puzzle.dims;

      // Track each candidate's current shape index (starts at index 0, which is NOT the target if possible!)
      const candidates = [puzzle.num];
      const allKeys = Object.keys(SHIFTER_SHAPES).map(Number).filter(n => rangeMode === "5" ? n <= 10 : n >= 6);
      while (candidates.length < 4) {
        const c = allKeys[Math.floor(Math.random() * allKeys.length)];
        if (!candidates.includes(c)) candidates.push(c);
      }

      const shapeIndexMap = {};
      candidates.forEach(n => { shapeIndexMap[n] = 0; });

      shifterState = { puzzle, candidates: shuffle(candidates), shapeIndexMap, solved: false };

      const stage = document.createElement("div");
      stage.className = "adventure-stage";
      stage.innerHTML = `
        <div class="prompt-banner">🟦 Pick a Numberblock, tap <strong>Morph</strong> to fit the doorway!</div>
        <div class="shifter-stage">
          <div class="shifter-door" id="shifterDoor" data-drop="shifterDoor">
            <div class="shifter-grid" id="shifterGrid" style="grid-template-columns: repeat(${cols}, auto);"></div>
            <div class="target-badge num-text">${rows} × ${cols}</div>
          </div>
          <div class="morph-controls">
            <button class="morph-btn" id="btnMorph" onclick="morphSelectedBlock()">✨ Morph Shape!</button>
            <div style="font-size:0.88rem;opacity:0.88;font-weight:700;" id="morphHint">Tap a Numberblock below</div>
          </div>
        </div>
      `;
      targetsArea.appendChild(stage);

      const grid = document.getElementById("shifterGrid");
      for (let i = 0; i < rows * cols; i++) {
        const cell = document.createElement("div");
        cell.className = "shifter-cell";
        grid.appendChild(cell);
      }

      document.getElementById("shifterDoor").addEventListener("pointerdown", () => {
        if (!selectedId || shifterState.solved) return;
        handleShifterDrop(Number(selectedId));
      });

      renderShifterPlayground();
      speak(`Find the Numberblock that fits the ${rows} by ${cols} doorway! Tap Morph to change its shape!`);
    }

    function renderShifterPlayground() {
      const playground = document.getElementById("playground");
      playground.innerHTML = "";
      shifterState.candidates.forEach(num => {
        const dims = SHIFTER_SHAPES[num][shifterState.shapeIndexMap[num]];
        const nb = buildNumberblock(num, false, dims);
        if (selectedId === String(num)) nb.classList.add("selected");
        attachDragAndTap(nb, String(num), () => {
          playCountChimes(Math.min(num, 6));
          speakNumber(num);
          document.getElementById("morphHint").textContent = `${NUMBER_DATA[num].name} is ${dims[0]} × ${dims[1]}`;
          document.getElementById("btnMorph").classList.add("pulse");
        });
        playground.appendChild(nb);
      });
    }

    function morphSelectedBlock() {
      if (!selectedId || shifterState.solved) {
        speak("Tap a Numberblock first!");
        return;
      }
      const num = Number(selectedId);
      const shapes = SHIFTER_SHAPES[num];
      shifterState.shapeIndexMap[num] = (shifterState.shapeIndexMap[num] + 1) % shapes.length;
      const dims = shapes[shifterState.shapeIndexMap[num]];
      playTone(587.33, 0.16);
      playTone(783.99, 0.2, 0.08);
      document.getElementById("morphHint").textContent = `${NUMBER_DATA[num].name} is now ${dims[0]} × ${dims[1]}!`;
      renderShifterPlayground();
      speak(`${dims[0]} by ${dims[1]}!`);
    }

    function handleShifterDrop(num) {
      if (shifterState.solved) return;
      const { puzzle, shapeIndexMap } = shifterState;
      const dims = SHIFTER_SHAPES[num][shapeIndexMap[num]];
      const [tR, tC] = puzzle.dims;

      if (num !== puzzle.num) {
        playTone(155, 0.25);
        speak("Count the squares in the doorway and try another Numberblock!");
        return;
      }

      if (dims[0] !== tR || dims[1] !== tC) {
        playTone(349.23, 0.2);
        document.getElementById("btnMorph").classList.add("pulse");
        speak(`Right number! Now tap Morph Shape to make ${tR} by ${tC}!`);
        return;
      }

      // Perfect fit!
      shifterState.solved = true;
      document.getElementById("btnMorph").classList.remove("pulse");
      const color = NUMBER_DATA[num].colors[0];
      document.querySelectorAll("#shifterGrid .shifter-cell").forEach((c, idx) => {
        setTimeout(() => {
          c.classList.add("filled");
          c.style.background = NUMBER_DATA[num].colors[idx % NUMBER_DATA[num].colors.length];
        }, idx * 30);
      });
      playSuccessChime();
      const isSq = tR === tC;
      speak(`Perfect fit! ${tR} by ${tC} makes ${NUMBER_DATA[num].name}!${isSq ? " That's a square!" : ""}`);
      advanceAdventureRound(1500);
    }

    /* ===========================
       ADVENTURE PROGRESSION & CELEBRATION
       =========================== */
    function advanceAdventureRound(delay = 1400) {
      setTimeout(() => {
        if (adventureRound >= ADVENTURE_TOTAL_ROUNDS) {
          handleRoundComplete();
        } else {
          adventureRound++;
          resetBoard();
        }
      }, delay);
    }

    function handleRoundComplete() {
      const celeb = document.getElementById("celebration");
      const title = document.getElementById("celebTitle");
      const sub = document.getElementById("celebSub");

      if (gameMode === "bed") {
        setTimeout(() => {
          document.body.classList.add("lights-out");
          playLullaby();
          speak("Shhh. Goodnight Numberblocks!", "goodnight_all");
          title.textContent = "Shhh... Goodnight! 😴";
          sub.textContent = "Every Numberblock is tucked into bed.";
          setTimeout(() => celeb.classList.add("visible"), 1000);
        }, 650);
      } else if (gameMode === "train") {
        speak("Choo choo! All aboard!", "train_complete");
        playTrainWhistle();
        document.getElementById("trainConsist")?.classList.add("train-departing");
        title.textContent = "Choo Choo! 🚂";
        sub.textContent = "The Numberblock Express is on its way!";
        setTimeout(() => celeb.classList.add("visible"), 1550);
      } else if (gameMode === "snack") {
        speak("Yummy! Everyone is full!", "snack_complete");
        playWakeUpChime();
        title.textContent = "Yummy! 🍎";
        sub.textContent = "All the Numberblocks ate their snacks!";
        setTimeout(() => celeb.classList.add("visible"), 900);
      } else if (gameMode === "shapes") {
        speak("You matched all the shapes!", "shapes_complete");
        playWakeUpChime();
        title.textContent = "Shape Superstar! 🌟";
        sub.textContent = "You matched every single shape!";
        setTimeout(() => celeb.classList.add("visible"), 900);
      } else {
        playWakeUpChime();
        const g = GAMES.find(x => x.id === gameMode);
        speak(`Amazing job! You finished ${g.name}!`);
        title.textContent = `${g.icon} Math Superstar!`;
        sub.textContent = `You completed all ${ADVENTURE_TOTAL_ROUNDS} rounds of ${g.name}!`;
        celeb.classList.add("visible");
      }
    }

    /* ===========================
       UNIFIED DRAG & TAP ENGINE
       =========================== */
    function attachDragAndTap(el, id, onTouchAudio) {
      el.addEventListener("pointerdown", (e) => {
        if (el.dataset.matched === "true") return;
        e.preventDefault();
        onTouchAudio();

        document.querySelectorAll(".draggable-item").forEach(item => item.classList.remove("selected"));
        el.classList.add("selected");
        selectedId = id;
        selectedUid = el.dataset.uid;

        const rect = el.getBoundingClientRect();
        const clone = el.cloneNode(true);
        clone.classList.add("dragging");
        clone.style.width = `${rect.width}px`;
        clone.style.left = `${rect.left}px`;
        clone.style.top = `${rect.top}px`;
        document.body.appendChild(clone);
        el.style.opacity = "0.28";

        activeDrag = {
          id,
          originalEl: el,
          cloneEl: clone,
          offsetX: e.clientX - rect.left,
          offsetY: e.clientY - rect.top,
          startX: e.clientX,
          startY: e.clientY,
          moved: false
        };
      });
    }

    function getDropTargets() {
      return document.querySelectorAll(".bed, .target-card, .puzzle-drop, .seesaw-pan.right-pan, .shifter-door");
    }

    window.addEventListener("pointermove", (e) => {
      if (!activeDrag) return;
      e.preventDefault();
      if (Math.hypot(e.clientX - activeDrag.startX, e.clientY - activeDrag.startY) > 6) {
        activeDrag.moved = true;
      }
      activeDrag.cloneEl.style.left = `${e.clientX - activeDrag.offsetX}px`;
      activeDrag.cloneEl.style.top = `${e.clientY - activeDrag.offsetY}px`;

      getDropTargets().forEach(target => {
        const r = target.getBoundingClientRect();
        const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
        target.classList.toggle("highlight", inside && !target.classList.contains("occupied"));
      });
    }, { passive: false });

    window.addEventListener("pointerup", (e) => {
      if (!activeDrag) return;
      const { id, originalEl, cloneEl, moved } = activeDrag;

      let hitTarget = null;
      getDropTargets().forEach(target => {
        target.classList.remove("highlight");
        const r = target.getBoundingClientRect();
        const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
        if (inside && !target.classList.contains("occupied")) {
          hitTarget = target;
        }
      });

      cloneEl.remove();
      originalEl.style.opacity = "1";
      activeDrag = null;

      if (!hitTarget || !moved) return;

      // Route drop based on current game mode
      if (gameMode === "team") {
        const dropType = hitTarget.dataset.drop;
        handleTeamDrop(Number(id), dropType === "teamA" ? "slotA" : dropType === "teamB" ? "slotB" : "auto");
      } else if (gameMode === "pattern") {
        if (hitTarget.dataset.drop === "patternCar") handlePatternDrop(Number(id), hitTarget);
      } else if (gameMode === "seesaw") {
        if (hitTarget.dataset.drop === "seesawRight") addSeesawBlock(Number(id));
      } else if (gameMode === "split") {
        const dropType = hitTarget.dataset.drop;
        handleSplitDrop(Number(id), dropType === "splitLeft" ? "left" : dropType === "splitRight" ? "right" : "auto");
      } else if (gameMode === "shifter") {
        if (hitTarget.dataset.drop === "shifterDoor") handleShifterDrop(Number(id));
      } else {
        // Classic matching modes
        if (hitTarget.dataset.id === id) {
          completeClassicMatch(id, hitTarget);
        } else {
          playTone(155, 0.25);
          speak("Count carefully and try again!", "count_carefully");
        }
      }
    });

    createStars();
    setGameMode("bed");
  </script>
</body>
</html>
